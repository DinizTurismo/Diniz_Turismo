<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lençóis Aventura - Agência de Turismo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: #1a1a2e;
            background: #f8f9fa;
            scroll-behavior: smooth;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 14px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.06);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: #0a9396;
        }

        .logo span {
            color: #e9c46a;
        }

        nav a {
            margin-left: 28px;
            text-decoration: none;
            color: #1a1a2e;
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #0a9396;
        }

        .btn-nav-reserva {
            background: #0a9396;
            color: #fff !important;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 600;
        }

        .btn-nav-reserva:hover {
            background: #087d80;
        }

        .hero {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a9396 0%, #005f73 50%, #001219 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 5% 80px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%, rgba(233, 196, 106, 0.08) 0%, transparent 60%);
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-30px, -30px); }
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 800px;
        }

        .hero h1 {
            font-size: 3.2rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 16px;
            line-height: 1.15;
        }

        .hero h1 span {
            color: #e9c46a;
        }

        .hero p {
            font-size: 1.15rem;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 36px;
            line-height: 1.6;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 36px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.3s;
            display: inline-block;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: #e9c46a;
            color: #1a1a2e;
        }

        .btn-primary:hover {
            background: #d4a843;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        .btn-secondary:hover {
            border-color: #e9c46a;
            color: #e9c46a;
            transform: translateY(-2px);
        }

        section {
            padding: 80px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            color: #1a1a2e;
            margin-bottom: 12px;
        }

        .section-subtitle {
            text-align: center;
            color: #6c757d;
            font-size: 1rem;
            margin-bottom: 48px;
        }

        .passeios-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 28px;
        }

        .card-passeio {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card-passeio:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
        }

        .card-passeio-img {
            height: 200px;
            background-color: #0a9396;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            padding: 12px;
            position: relative;
        }

        .card-passeio-img .tag {
            background: #e9c46a;
            color: #1a1a2e;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .card-passeio-body {
            padding: 24px;
        }

        .card-passeio-body h3 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .card-passeio-body p {
            color: #6c757d;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .card-passeio-body .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #495057;
        }

        .card-passeio-body .precos {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #e9ecef;
        }

        .card-passeio-body .preco-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        .card-passeio-body .preco-item .valor {
            font-weight: 700;
            color: #0a9396;
        }

        .form-section {
            background: #fff;
            border-radius: 20px;
            padding: 48px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            max-width: 800px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: #1a1a2e;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s;
            background: #f8f9fa;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #0a9396;
            background: #fff;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
        }

        .checkbox-item:hover {
            border-color: #0a9396;
        }
